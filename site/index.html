<!doctype html>
<html lang="en" class="dark" style="color-scheme:dark;background:#070707">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><link rel="icon" href="data:,">
<title>Turnstile payload variability — build 3158346939</title>
<style>:root {
color-scheme: dark;
--bg: #070707;
--fg: #fcfcfc;
--fg-2: rgba(252, 252, 252, 0.6);
--fg-3: rgba(252, 252, 252, 0.4);
--line: rgba(252, 252, 252, 0.15);
--fill: rgba(119, 119, 119, 0.173);
--fill-hover: rgba(119, 119, 119, 0.26);
--card: rgba(252, 252, 252, 0.03);
--accent: #1d8cf8;
--accent-dim: #165296;
--warning: #f5a524;
--font: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;
--mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { padding: 24px 32px 64px; font: 13px/1.385 var(--font); -webkit-font-smoothing: antialiased; }
@media (max-width: 480px) { body { padding: 16px; } }
.page { max-width: 1100px; margin: 0 auto; overflow-wrap: anywhere; }
h1 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.4px; }
.summary { margin: 20px 0 0; font-size: 16px; line-height: 24px; letter-spacing: 0.1px; }
h2 { margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.25px; scroll-margin-top: 16px; }
.section { margin-top: 56px; scroll-margin-top: 16px; }
.blocks > * + * { margin-top: 24px; }
.blocks { margin-top: 16px; }
.text { margin: 0; font-size: 15px; line-height: 22px; letter-spacing: 0.1px; }
.caption { margin: 0; color: var(--fg-2); font-size: 13px; line-height: 18px; }
code { font-family: var(--mono); font-size: 0.86em; }
strong { font-weight: 600; }
/* contents */
.toc { margin-top: 32px; display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; }
.toc-title { margin: 0 0 4px; font-size: 12px; line-height: 16px; color: var(--fg-2); }
.toc a { display: block; margin: -2px -6px; padding: 2px 6px; border-radius: 4px; font-size: 14px; line-height: 20px; letter-spacing: 0.1px; color: var(--fg-2); text-decoration: none; }
.toc a:hover { background: var(--fill); color: var(--fg); }
.toc a[aria-current] { color: var(--fg); font-weight: 500; }
/* properties */
.props { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 14px; line-height: 20px; }
.props dt { color: var(--fg-2); }
.props dd { margin: 0; }
/* tables */
.table-scroll { overflow-x: auto; min-width: 0; }
.table { min-width: 100%; border-collapse: separate; border-spacing: 0; border: 0.5px solid var(--line); border-radius: 10px; overflow: hidden; overflow-wrap: normal; }
.table th, .table td { padding: 8px 10px; text-align: start; vertical-align: top; border-inline-start: 0.5px solid var(--line); }
.table th:first-child, .table td:first-child { border-inline-start: 0; }
.table th { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: 0.1px; white-space: nowrap; border-bottom: 0.5px solid var(--line); }
.table td { font-size: 15px; line-height: 22px; letter-spacing: 0.1px; border-top: 0.5px solid var(--line); min-width: 60px; }
.table td:not(.num) { min-width: 120px; }
.table tbody tr:first-child td { border-top: 0; }
.table .num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table td code { white-space: nowrap; }
.tone-warning { color: var(--warning); }
/* cards, grid */
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.grid { display: grid; gap: 16px; align-items: start; }
.grid.plain { gap: 14px 24px; align-items: end; }
.grid-cell > .card { border: 0; padding: 0; }
/* callout */
.callout { padding: 12px 14px; border-radius: 12px; background: var(--fill); font-size: 15px; line-height: 22px; letter-spacing: 0.1px; }
.callout-lead { font-weight: 600; }
/* bars */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: minmax(120px, 30%) 1fr 48px; gap: 16px; align-items: center; font-size: 13px; line-height: 18px; }
.bar-label { color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar.top .bar-label { color: var(--fg); }
.bar-track { height: 4px; border-radius: 9999px; background: rgba(252, 252, 252, 0.08); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 9999px; background: var(--accent-dim); }
.bar.top .bar-fill { background: var(--accent); }
.bar-value { text-align: end; font-variant-numeric: tabular-nums; }
/* form controls */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; align-items: flex-start; }
.field.wide { align-items: stretch; }
.field label { font-size: 12px; line-height: 16px; color: var(--fg-2); }
.select-wrap { position: relative; display: inline-flex; align-items: center; max-width: 100%; }
.select-wrap svg { position: absolute; right: 8px; width: 12px; height: 12px; pointer-events: none; color: var(--fg-2); }
select, input[type="text"] { font: 14px/20px var(--font); letter-spacing: 0.1px; color: var(--fg); background: var(--fill); border: 0; border-radius: 8px; min-height: 28px; outline: none; }
select { appearance: none; -webkit-appearance: none; padding: 4px 28px 4px 8px; max-width: 100%; cursor: pointer; }
select option { background: #1a1a1a; color: var(--fg); }
input[type="text"] { padding: 4px 8px; width: 100%; }
input[type="text"]::placeholder { color: var(--fg-3); }
select:hover, input[type="text"]:hover { background: var(--fill-hover); }
select:focus-visible, input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.switch { position: relative; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; letter-spacing: 0.1px; cursor: pointer; user-select: none; min-height: 28px; }
.switch input { position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0; }
.switch-track { position: relative; width: 32px; height: 18px; flex-shrink: 0; border-radius: 9999px; background: rgba(252, 252, 252, 0.3); transition: background 150ms; }
.switch-thumb { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 9999px; background: var(--bg); transition: transform 150ms; }
.switch.on .switch-track { background: var(--accent); }
.switch.on .switch-thumb { transform: translateX(14px); background: #fff; }
.switch:has(input:focus-visible) .switch-track { outline: 2px solid var(--accent); outline-offset: 1px; }
.segmented { display: flex; flex-wrap: wrap; gap: 16px; }
.blocks > .segmented + .segmented { margin-top: 10px; }
.segmented button { margin: 0; padding: 0; border: 0; background: none; cursor: pointer; font: 13px/18px var(--font); letter-spacing: -0.08px; color: var(--fg-3); }
.segmented button:hover { color: var(--fg); }
.segmented button span { display: inline-block; padding: 2px 0; border-bottom: 1.5px solid transparent; }
.segmented button[aria-pressed="true"] { color: var(--fg); font-weight: 500; }
.segmented button[aria-pressed="true"] span { border-bottom-color: var(--fg); }
.btn { display: inline-flex; align-items: center; justify-self: start; padding: 4px 10px; border: 0; border-radius: 9999px; font: 500 12px/16px var(--font); color: var(--fg); background: var(--fill); cursor: pointer; }
.btn:hover { background: var(--fill-hover); }
.btn.primary { color: #141414; background: #fafafa; }
.btn.primary:hover { background: #e6e6e6; }
</style>
</head>

ur diffs."],["JS engine & Math precision","Math precision on fixed inputs is constant per engine/CPU and acts as an engine check that should match the claimed UA. bmma1 is an eval/global-this consistency number that probe 27 compares with slot 21 (VM anti-tamper)."],["Probe envelope & bookkeeping","The envelope (tag, config blob, status, start/end/duration, executor) is bookkeeping: it tells the server which probes ran, whether they failed and how long they took. Durations double as a weak timing signal; status codes change when a probe throws (e.g. under hooks)."],["Navigator, UA & client hints","The UA string and high-entropy client hints are reported side by side so they can be checked against each other and against engine behaviour; client hints moved with the UA preset in our diffs. The keyboard layout map adds per-machine entropy and differed in headless mode."],["DOM, document & CSS","The DOM behaviour battery, image-load checks and <html> attribute list distinguish real rendering engines from emulated/headless ones and detect attributes injected by extensions or hooks (observed under hook injection)."],["Fonts & text metrics","Installed fonts and text metrics are classic per-machine entropy; the font-probe timing lists are run-to-run timing data."],["Network information","Connection type and online state describe the network profile; plausibly compared with the IP's network type server-side (not knowable)."],["Stack / error / devtools fingerprints","Error().stack line:column positions move when the challenge script is wrapped or code is injected (observed under hook injection and stack-limit changes). Probe 37 traps console/devtools, Proxy and toString, which change when harness wrappers are visible."],["Canvas & WebGL","WebGL vendor/renderer, parameters and canvas pixels identify the GPU stack; they moved with GPU readback changes, and headless/software-GL modes produce distinctive values."],["Locale, Intl & timezone","Timezone, Intl formatting and historical Date offsets give locale entropy and can be checked against the IP's geography server-side; they moved with timezone and locale changes in our diffs."],["Crypto & audio hashes","Audio-render digests are device entropy. The four SHA-256 digests of fixed inputs are constants: they only confirm that crypto.subtle behaves like a real browser."],["Performance & memory","Navigation timing, body sizes, Trusted Types/nonce checks and navigation type describe how the page was loaded, whether it was rewritten, and whether it is a reload/replay."],["WebRTC & media","WebRTC offer/ICE and codec lists expose network interfaces and the media stack; they help detect proxies/VMs and add entropy."],["Page-supplied info (PUUDF8)","PUUDF8 page info is supplied by the challenge page and echoed back to bind the payload to it; its page-fingerprint and script-length counters changed when scripts were injected."],["Device, display & sensors","Media queries, battery and permission states are device/display entropy; permission and battery states are commonly abnormal in headless/VM setups (hypothesis)."],["Native-function integrity checks",'Probe 27 tests a long list of native functions for patches: .arguments access, prototype===undefined, own property names and toString containing "[native code]". These lists changed under the hook modes in our diff runs.'],["Challenge context & session state","Members of the server's challenge object are echoed back so the payload is bound to this challenge instance; serialized state strings carry the same binding."],["Timing & performance clocks","Differences between challenge timestamps and Date.now() at send show how old the challenge is (freshness/replay); performance.now() deltas add execution-timing data."]],A1="Server-side use is out of scope and cannot be known from the client. 'purpose' describes what the client-side check can distinguish, not proven server scoring. 'observed' = the field changed in our offline diff runs when the cited dimensio
